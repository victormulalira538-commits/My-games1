<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pokemon Quetzal</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        margin: 0;
        padding: 0;
      }
      #startButton {
        display: block;
        width: 160px;
        height: 40px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <button id="startButton">PLAY GAME</button>
    <div id="game" style="display: none; width: 100%; height: 100%;"></div>

    <script>
      function startGame() {
        document.getElementById("game").style.display = "block";
        document.getElementById("startButton").style.display = "none";
        
        window.EJS_player = "#game";
        window.EJS_core = "gba";
        window.EJS_color = "#000000";
        window.EJS_startOnLoaded = true;
        window.EJS_pathtodata = "https://jsdelivr.net";
        window.EJS_gameUrl = "https://jsdelivr.net";
        
        var script = document.createElement("script");
        script.src = "https://jsdelivr.netloader.js";
        document.body.appendChild(script);
      }
      document.getElementById("startButton").addEventListener("click", startGame);
    </script>
  </body>
</html>
